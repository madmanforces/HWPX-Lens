[package]
name = "hwpx-lens"
version = "0.1.1"
description = "Offline-first HWPX comparison and review"
authors = ["HWPX Lens contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "hwpx_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
